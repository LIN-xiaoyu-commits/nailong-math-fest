<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f1">
<title>奶龙大学 · 校园建设模拟赛</title>
<meta name="description" content="用 1000 万预算经营一所大学：6 个场景、隐藏结算、80 分领奖；没到 80 分答一道题再来。本游戏仅供娱乐。">
<meta property="og:title" content="奶龙大学 · 校园建设模拟赛">
<meta property="og:description" content="用 1000 万预算经营一所大学：6 个场景、隐藏结算、80 分领奖。本游戏仅供娱乐。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   奶龙大学 · 数模社团文化节版
   风格参考 BigNaiWa：奶油渐变底 + 玻璃白卡 + 珊瑚红主色 + 水果精灵
   ============================================================ */
:root{
  --ink:#4a3325;
  --ink-soft:#8a7566;
  --cream:#fff7ec;
  --brand:#ff6b6b;
  --brand-dark:#e14b4b;
  --brand-soft:#fff0ef;
  --sun:#ffc94d;
  --green:#3fb984;
  --green-deep:#2c8662;
  --blue:#5aa9e6;
  --pink:#ff9fb2;
  --line:rgba(74,51,37,.11);
  --card:rgba(255,255,255,.78);
  --shadow:0 18px 50px rgba(126,84,44,.18);
  --shadow-soft:0 8px 24px rgba(126,84,44,.10);
  --radius:24px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  line-height:1.65;
  min-height:100vh;
  overflow-x:hidden;
  background:
    radial-gradient(1200px 700px at 8% -12%, #ffe9bd 0%, transparent 60%),
    radial-gradient(900px 600px at 104% -6%, #d5f0ff 0%, transparent 55%),
    radial-gradient(1000px 780px at 50% 118%, #ffdbe6 0%, transparent 62%),
    #fff9f1;
  background-attachment:fixed;
}
button{font-family:inherit;color:inherit}
a{color:var(--brand-dark)}
h1,h2,h3,h4,p{margin:0}
img{max-width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:10px}
::selection{background:#ffd9d9;color:var(--ink)}
.skip{position:fixed;left:12px;top:-64px;z-index:200;background:#fff;color:var(--brand-dark);border:1px solid #ffd2d2;padding:8px 14px;border-radius:999px;font-weight:800;text-decoration:none;transition:top .2s;box-shadow:var(--shadow-soft)}
.skip:focus{top:12px}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.tiny{font-size:11.5px;color:var(--ink-soft);line-height:1.65}

.page{max-width:1120px;margin:0 auto;padding:14px 16px calc(44px + var(--safe-b));animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------------- 文化节横条 / 顶栏 ---------------- */
.festival-bar{
  display:flex;justify-content:center;align-items:center;gap:8px;text-align:center;
  margin:0 0 12px;padding:7px 14px;border-radius:999px;
  background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.18);
  color:#b44747;font-size:12px;font-weight:800;letter-spacing:.2px;
}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand-logo{width:50px;height:50px;flex:none;border-radius:17px;background:#fff;border:1px solid #ffe0c9;box-shadow:var(--shadow-soft);display:grid;place-items:center;padding:5px;font-size:26px;line-height:1}
.brand-img{width:100%;height:100%;object-fit:contain;transform:rotate(-4deg)}
.brand-name{font-size:20px;font-weight:900;line-height:1.25;letter-spacing:.4px}
.brand-sub{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:#b08a6a;margin-top:1px}
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.club-chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid #ffd9c2;color:#b3592c;font-size:11px;font-weight:900;box-shadow:var(--shadow-soft);white-space:nowrap}

/* ---------------- 按钮 ---------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1.5px solid #ffd7ce;border-radius:999px;background:#fff;color:var(--ink);
  padding:10px 18px;font-weight:850;font-size:14px;line-height:1.2;min-height:44px;
  cursor:pointer;text-decoration:none;white-space:nowrap;
  box-shadow:0 4px 14px rgba(126,84,44,.10);
  transition:transform .15s ease,box-shadow .15s ease,background .15s ease,border-color .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(126,84,44,.16);border-color:#ffb9ae}
.btn:active{transform:translateY(0) scale(.985)}
.btn-primary{background:linear-gradient(180deg,#ff7d7d,#ff5f5f);border-color:#ff5f5f;color:#fff;box-shadow:0 8px 22px rgba(255,95,95,.34)}
.btn-primary:hover{background:linear-gradient(180deg,#ff8a8a,#ff6969);border-color:#ff6969;box-shadow:0 10px 26px rgba(255,95,95,.4)}
.btn-ghost{background:rgba(255,255,255,.7)}
.btn-soft{background:#fff4ed;border-color:#ffd9c8;color:#9a5a2d;box-shadow:var(--shadow-soft)}
.btn-sm{min-height:36px;padding:7px 13px;font-size:12.5px;border-radius:999px}
.btn-lg{min-height:52px;padding:14px 26px;font-size:17px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none!important}
.btn-danger{background:#fff1ef;border-color:#ffc9c0;color:#a8443b}
.link-btn{background:none;border:0;padding:4px 0;font-size:12px;font-weight:800;color:#b08a6a;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:36px}
.link-btn:hover{color:var(--brand-dark)}

/* ---------------- 开场 ---------------- */
.hero{
  position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;
  padding:30px 32px;border-radius:32px;
  background:
    radial-gradient(600px 320px at 88% 10%, rgba(255,255,255,.9) 0%, transparent 70%),
    radial-gradient(520px 340px at 4% 110%, rgba(255,213,157,.75) 0%, transparent 70%),
    linear-gradient(135deg,#fff1d6 0%,#ffe3dd 52%,#e8f4ff 100%);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.hero-copy{position:relative;z-index:2;min-width:0;flex:1}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#b3592c;background:rgba(255,255,255,.66);border:1px solid #ffe0c4;border-radius:999px;padding:4px 12px;margin-bottom:12px}
.hero h1{font-size:clamp(27px,4.4vw,44px);line-height:1.22;font-weight:900;letter-spacing:.3px;margin:0 0 12px}
.hero h1 em{font-style:normal;color:var(--brand-dark);position:relative;white-space:nowrap}
.hero h1 em:after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:7px;border-radius:6px;background:rgba(255,107,107,.22);z-index:-1}
.hero p{font-size:13.5px;color:#6f5643;font-weight:500;max-width:60ch;line-height:1.75}
.hero-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.hero-tag{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(126,84,44,.08);border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:800;color:#7c5a3c}
.hero-art{position:relative;z-index:1;flex:none;width:300px;height:230px;pointer-events:none}
.hero-fruit{position:absolute;filter:drop-shadow(0 14px 18px rgba(126,84,44,.22));user-select:none}
.hero-fruit.f1{width:150px;right:48px;bottom:0;transform:rotate(-5deg)}
.hero-fruit.f2{width:92px;right:0;top:16px;transform:rotate(9deg)}
.hero-fruit.f3{width:72px;left:0;top:8px;transform:rotate(-12deg);opacity:.95}
.float-sym{position:absolute;font-family:var(--mono);font-weight:900;color:rgba(255,107,107,.55);text-shadow:0 3px 0 rgba(255,255,255,.7)}
.float-sym.s1{font-size:34px;left:26px;top:62px;transform:rotate(-8deg)}
.float-sym.s2{font-size:26px;right:6px;bottom:58px;transform:rotate(12deg)}
.float-sym.s3{font-size:30px;right:118px;top:2px;transform:rotate(-14deg);color:rgba(90,169,230,.65)}
.float-sym.s4{font-size:15px;left:92px;bottom:20px;transform:rotate(6deg);color:rgba(63,185,132,.7)}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero-fruit.f1{animation:floaty 5.2s ease-in-out infinite}
.hero-fruit.f2{animation:floaty 4.4s ease-in-out .5s infinite}
.hero-fruit.f3{animation:floaty 5.8s ease-in-out .9s infinite}

.start-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:16px;margin-top:16px}
.start-grid>*{min-width:0}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.85);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}
.card-title{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:900;letter-spacing:.2px}
.card-title .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,#ff8a8a,#ffcf45);flex:none}
.name-hint{font-size:12px;color:var(--ink-soft);margin-top:5px}
.name-stage{display:flex;align-items:stretch;gap:12px;margin:16px 0 8px}
.name-display{
  flex:1;min-width:0;display:flex;align-items:center;gap:12px;
  background:linear-gradient(135deg,#fffdf8,#fff4e6);border:1px solid #ffe4c8;border-radius:18px;padding:11px 14px;
}
.name-display>*{min-width:0}
.name-avatar-wrap{width:56px;height:56px;flex:none;border-radius:15px;background:#fff;border:1px solid #ffe4c8;display:grid;place-items:center;padding:4px;box-shadow:0 3px 10px rgba(126,84,44,.08)}
.name-avatar{width:100%;height:100%;object-fit:contain;transition:transform .2s}
.name-body{min-width:0;flex:1}
.name-label{font-size:10px;font-weight:800;letter-spacing:1.2px;color:#b08a6a}
.name-text{font-size:clamp(20px,3.6vw,28px);font-weight:900;line-height:1.3;letter-spacing:.3px;word-break:break-all;transition:filter .15s}
.name-text.is-rolling{animation:nameFlicker .12s linear infinite}
@keyframes nameFlicker{0%{opacity:.45;transform:translateY(-1px)}50%{opacity:1;transform:translateY(0)}100%{opacity:.55;transform:translateY(1px)}}
.dice{
  width:76px;flex:none;border:0;border-radius:20px;cursor:pointer;position:relative;
  background:linear-gradient(180deg,#fff3e0,#ffe3c4);border:1px solid #ffd9b8;
  box-shadow:0 8px 18px rgba(216,140,80,.24);
  font-size:36px;display:grid;place-items:center;user-select:none;
  transition:transform .15s ease,box-shadow .15s;
}
.dice:hover{transform:rotate(-6deg) translateY(-3px);box-shadow:0 12px 22px rgba(216,140,80,.3)}
.dice:active{transform:scale(.97)}
.dice.is-rolling{animation:diceRoll .55s ease-in-out}
@keyframes diceRoll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-16deg) scale(1.06)}50%{transform:rotate(14deg) scale(.96)}75%{transform:rotate(-8deg) scale(1.04)}100%{transform:rotate(0) scale(1)}}
.name-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.start-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.start-actions .row{display:flex;gap:10px;flex-wrap:wrap}
.start-actions .row .btn{flex:1;min-width:145px}
.disclaimer-mini{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:10px;line-height:1.6}

.steps{list-style:none;margin:12px 0 0;padding:0;counter-reset:step}
.steps li{position:relative;padding:8px 0 8px 34px;border-bottom:1px dashed rgba(74,51,37,.1);font-size:12.5px;line-height:1.6}
.steps li:last-child{border-bottom:0}
.steps li:before{counter-increment:step;content:counter(step);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;background:#ffe6d6;color:#b3592c;display:grid;place-items:center;font-size:11px;font-weight:900}
.steps li b{display:block;font-size:13.5px;line-height:1.5}
.steps li span{color:var(--ink-soft);font-size:12px}
.goal{display:flex;gap:14px;align-items:center;margin-top:14px;background:linear-gradient(135deg,#fff7e4,#ffecee);border:1px dashed #ffc9bb;border-radius:18px;padding:12px 14px}
.goal-num{flex:none;font-size:40px;font-weight:900;line-height:1;color:#fff;background:linear-gradient(180deg,#ff8a8a,#ff5f5f);border-radius:16px;padding:7px 13px 9px;box-shadow:0 8px 18px rgba(255,95,95,.28)}
.goal-num small{font-size:12px;font-weight:800;margin-left:2px}
.goal p{font-size:12px;color:#8a5a3a;line-height:1.65}
.goal p b{color:var(--ink)}
.tip-card{margin-top:12px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow-soft)}
.tip-label{font-size:11px;font-weight:900;letter-spacing:.6px;color:#b3592c;margin-bottom:3px}
.tip-quote{font-size:12.5px;color:#6f5643;line-height:1.7;font-weight:600}

/* ---------------- 娱乐声明 ---------------- */
.notice-tape{
  display:flex;align-items:center;gap:9px;justify-content:center;text-align:center;
  background:linear-gradient(135deg,#fff4d6,#ffe6e3);
  border:2px dashed rgba(225,75,75,.55);border-radius:16px;padding:9px 16px;
  font-weight:900;font-size:13px;letter-spacing:.4px;color:#a8443b;
  box-shadow:0 8px 22px rgba(126,84,44,.14);
  transform:rotate(-1deg);margin:18px auto 0;width:fit-content;max-width:100%;line-height:1.5;
}
.notice-tape .tape-emoji{font-size:16px;flex:none}
.notice-tape small{display:block;font-weight:600;font-size:11px;letter-spacing:0;color:#a07a63}
.notice-tape.floating{transform:rotate(-1.2deg)}

/* ---------------- 游戏页 ---------------- */
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hud-item{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow-soft);min-width:0}
.hud-item small{display:block;font-size:10.5px;font-weight:800;color:var(--ink-soft);letter-spacing:.4px;white-space:nowrap}
.hud-item b{display:block;font-size:clamp(18px,3.4vw,24px);line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-item b .unit{font-size:11px;font-weight:700;color:var(--ink-soft)}
.hud-item.flash{animation:flash .55s ease}
@keyframes flash{0%{background:#fff3d6;border-color:#ffd7a1}100%{background:var(--card);border-color:rgba(255,255,255,.9)}}
.round-sub{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:1px}
.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.game-layout>*{min-width:0}
.round-card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.round-tag{display:inline-flex;align-items:center;gap:6px;background:#fff0ea;border:1px solid #ffd9c8;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:900;color:#b3592c;letter-spacing:.3px}
.round-title{display:flex;align-items:flex-start;gap:10px;margin:12px 0 6px}
.round-title h2{font-size:clamp(20px,3.2vw,27px);line-height:1.3;font-weight:900;letter-spacing:.2px}
.round-icon{font-size:28px;line-height:1;flex:none;transform:translateY(2px)}
.round-desc{font-size:13.5px;color:#6f5643;font-weight:500;line-height:1.7;margin-bottom:12px}
.scene{background:#fff;border:1px solid rgba(74,51,37,.08);border-radius:20px;overflow:hidden;margin-bottom:12px}
.scene svg{display:block;width:100%;height:auto}
.scene-caption{font-size:11.5px;color:var(--ink-soft);padding:7px 12px 9px;background:#fffaf2;border-top:1px dashed rgba(74,51,37,.08);font-weight:600}
.hint{display:flex;gap:8px;background:#fff7e6;border:1px dashed #ffd9a8;border-radius:14px;padding:9px 12px;font-size:12.5px;color:#8a5a2e;margin-bottom:10px;line-height:1.6;font-weight:600}
.hint .hint-ico{flex:none}
.pick-hint{font-size:11.5px;font-weight:700;color:#b08a6a;margin:10px 2px 8px}
.choice-meta{font-size:12px;color:#8a7566;margin-top:6px;line-height:1.5}
.choice-risk{font-size:11.5px;color:#a8443b;margin-top:5px;line-height:1.5;background:#fff5f2;border-radius:8px;padding:4px 7px}
.simple-list{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.simple-list li{position:relative;padding-left:16px;font-size:13px;color:#5d4635;line-height:1.55}
.simple-list li:before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:#ff9fb2}
.result-note{font-size:12px;color:#8a7566;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:8px 12px;margin-top:8px;line-height:1.6}
.rv-round{display:inline-block;font-size:11px;font-weight:800;color:#b3592c;margin-right:6px}
.options{display:grid;grid-template-columns:1fr;gap:11px}
.choice{
  position:relative;display:flex;flex-direction:column;text-align:left;background:rgba(255,255,255,.92);
  border:1.5px solid rgba(74,51,37,.08);border-radius:18px;padding:14px 15px;cursor:pointer;
  box-shadow:0 5px 16px rgba(126,84,44,.07);
  transition:transform .14s,box-shadow .14s,border-color .14s,background .14s;
  min-height:44px;font-family:inherit;font-size:15px;color:var(--ink);
}
.choice:hover{transform:translateY(-2px);border-color:#ffc9b8;box-shadow:0 10px 24px rgba(126,84,44,.13)}
.choice:active{transform:translateY(0) scale(.995)}
.choice.is-locked{opacity:.6;cursor:not-allowed;background:#fbf8f3}
.choice.is-locked:hover{transform:none;box-shadow:0 5px 16px rgba(126,84,44,.07)}
.choice.is-picked{background:#fff8e6;border-color:#ffc94d}
.choice-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.choice-title{font-weight:900;font-size:14.5px;line-height:1.45;min-width:0}
.choice-title .letter{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:6px;border-radius:50%;background:#fff0e6;border:1px solid #ffd9c8;color:#b3592c;font-size:11.5px;font-weight:900;vertical-align:1px}
.cost{flex:none;font-size:11.5px;font-weight:800;white-space:nowrap;padding:4px 9px;border-radius:999px;background:#fff4e6;border:1px solid #ffe0c2;color:#a06a2c}
.cost.earn{background:#eafaf1;border-color:#bfe9d2;color:#2c8662}
.cost.gray{background:#f5f0ea;border-color:#e8ded2;color:#9b8b7a}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f7f1e8;color:#7c6a59;white-space:nowrap}
.tag.risk{background:#fff0ee;color:#b04a3e}
.tag.cash{background:#eafaf1;color:#2c8662}
.tag.badge{background:#fff2cf;color:#9a6a13;border:1px dashed #f0cf8d}
.choice-note{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.55}
.risk-line{display:flex;gap:5px;font-size:11.5px;color:#a8443b;margin-top:6px;line-height:1.5;background:#fff5f2;border-radius:10px;padding:5px 8px}
.risk-line .risk-ico{flex:none}
.game-side{display:grid;gap:13px}
.side-card{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:15px 16px;box-shadow:var(--shadow-soft)}
.side-card h3{font-size:13px;font-weight:900;display:flex;align-items:center;gap:6px;margin-bottom:10px}
.progresslabel{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:5px}
.progress{height:10px;background:#f3ece2;border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb86b,#ff6b6b);border-radius:999px;transition:width .45s ease}
.metric{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed rgba(74,51,37,.09);font-size:12.5px;font-weight:700}
.metric:last-of-type{border-bottom:0}
.metric .locked{font-size:10.5px;font-weight:800;color:#a08a6c;background:#fff6ea;border-radius:999px;padding:2px 8px;white-space:nowrap}
.side-event{background:linear-gradient(135deg,#fff9e8,#fff1e4);border:1px dashed #ffd9a8}
.side-event .ev-emoji{font-size:20px}
.side-event b{display:block;font-size:13px;margin:2px 0 3px}
.side-event p{font-size:11.5px;color:#8a5a2e;line-height:1.55}
.side-note{font-size:11.5px;color:var(--ink-soft);line-height:1.65}
.side-note b{color:var(--ink)}
.side-disclaimer{background:#fff6d8;border:2px dashed rgba(225,75,75,.4);border-radius:14px;padding:9px 11px;font-size:11.5px;font-weight:900;color:#a8443b;text-align:center;line-height:1.55;transform:rotate(-.8deg)}
.side-disclaimer span{display:block;font-weight:600;font-size:10.5px;margin-top:2px}

/* ---------------- 印章 ---------------- */
.seal-overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:rgba(74,51,37,.24);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .16s ease}
.seal-stamp{background:#fffdf8;border:1.5px solid #ffd7c9;border-radius:22px;padding:20px 28px;box-shadow:0 24px 60px rgba(74,51,37,.28);transform:rotate(-3deg);text-align:center;animation:stampIn .32s cubic-bezier(.2,1.6,.4,1)}
.seal-stamp .seal-main{font-size:17px;font-weight:900;letter-spacing:.3px}
.seal-stamp .seal-sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.seal-stamp .seal-icon{font-size:26px;display:block;margin-bottom:2px}
@keyframes stampIn{0%{transform:rotate(-12deg) scale(1.85);opacity:0}100%{transform:rotate(-3deg) scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------------- 结算 ---------------- */
.result-hero{position:relative;text-align:center;padding:30px 22px 24px;border-radius:30px;overflow:hidden;
  background:
    radial-gradient(500px 260px at 88% -10%, rgba(255,255,255,.9) 0%, transparent 70%),
    radial-gradient(420px 280px at 0% 110%, rgba(255,213,157,.7) 0%, transparent 70%),
    linear-gradient(135deg,#fff1d6,#ffe1e1 55%,#e7f4ff);
  border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);margin-bottom:16px}
.result-mascot-wrap{position:absolute;right:18px;bottom:-8px;width:150px;height:150px;pointer-events:none;opacity:.95}
.result-mascot{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(126,84,44,.2));transform:rotate(6deg)}
.result-kicker{font-size:11.5px;font-weight:800;letter-spacing:1.6px;color:#b3592c;position:relative;z-index:1}
.score-big{font-size:clamp(58px,11vw,90px);font-weight:900;line-height:1.05;color:var(--brand-dark);font-variant-numeric:tabular-nums;letter-spacing:-1px;position:relative;z-index:1}
.score-big small{font-size:20px;font-weight:800;color:#b07a63;letter-spacing:0}
.result-title{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #ffd9c8;border-radius:999px;padding:5px 15px;font-size:14px;font-weight:900;color:#8a4a35;box-shadow:0 6px 16px rgba(126,84,44,.1);margin-top:5px;position:relative;z-index:1}
.result-name{font-size:13px;font-weight:700;color:#8a6a54;margin-top:9px;position:relative;z-index:1}
.prize-wrap{margin:16px 0}
.prize-card{position:relative;background:linear-gradient(135deg,#fffaf0,#fff1e2);border:1px solid #ffe0bf;border-radius:24px;padding:20px;box-shadow:var(--shadow);overflow:hidden}
.prize-card:before{content:"";position:absolute;inset:7px;border:1.5px dashed #f0cc9a;border-radius:17px;pointer-events:none}
.prize-head{position:relative;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.prize-flag{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ffd76a,#ffc23d);border:1px solid #f0b52e;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:900;color:#6b4708;transform:rotate(-2deg);box-shadow:0 4px 12px rgba(240,181,46,.28)}
.prize-head h3{font-size:clamp(17px,3vw,21px);font-weight:900}
.prize-sub{font-size:12.5px;color:#8a5a3a;margin-top:4px;position:relative;font-weight:500;line-height:1.65}
.save-reminder{position:relative;background:linear-gradient(135deg,#fff3c4,#ffe1d6);border:2px dashed #ff9f7a;color:#9a3f2c;font-weight:900;font-size:14px;border-radius:14px;padding:10px 12px;margin-bottom:14px;text-align:center;line-height:1.5;box-shadow:0 6px 16px rgba(255,159,122,.16)}
.model-note{margin:16px 0;padding:14px 16px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-left:4px solid #ff8a8a;border-radius:16px;box-shadow:var(--shadow-soft)}
.model-note h3{font-size:14px;font-weight:900;margin:0 0 6px;color:#8a4a35}
.model-note p{font-size:12.5px;color:#6f5643;line-height:1.75;margin:0 0 6px}
.model-note p:last-child{margin-bottom:0}
.voucher{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;margin-top:14px;background:#fff;border:1.5px dashed #e8c98f;border-radius:18px;padding:14px 16px}
.voucher-info{min-width:0}
.voucher-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0;border-bottom:1px dashed #efe4cf}
.voucher-row:last-child{border-bottom:0}
.voucher-row span{color:var(--ink-soft);font-weight:700;white-space:nowrap}
.voucher-row b{font-weight:900;text-align:right;word-break:break-all}
.voucher-code{font-family:var(--mono);letter-spacing:2px;font-size:clamp(17px,3.4vw,22px);background:#fff8dc;border:1.5px dashed #e8c98f;border-radius:10px;padding:5px 10px;display:inline-block;margin-top:8px;font-weight:900;color:#7a5410}
.voucher-qr{text-align:center}
.voucher-qr svg{width:132px;height:132px;background:#fff;border:1.5px dashed #e8c98f;border-radius:12px;padding:6px}
.voucher-qr .qr-cap{font-size:10.5px;color:var(--ink-soft);font-weight:700;margin-top:4px}
.miss-card{background:linear-gradient(135deg,#fff5f2,#ffeceb);border:1.5px dashed #f0b6a9;border-radius:24px;padding:20px 22px;box-shadow:var(--shadow-soft)}
.miss-card h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.miss-card p{font-size:13px;color:#8a5a50;margin-top:5px;line-height:1.7}
.miss-card .gap-pill{background:#fff;border:1px solid #f0b6a9;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:900;color:#b04a3e}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.score-card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:11px 13px;box-shadow:var(--shadow-soft)}
.score-card small{display:block;font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.score-card b{font-size:clamp(19px,4vw,25px);font-variant-numeric:tabular-nums;color:var(--brand-dark)}
.score-card b small{display:inline;font-size:11px;color:var(--ink-soft);font-weight:700}
.formula{background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:16px;padding:12px 14px;font-size:12px;color:#6f5643;line-height:1.75;box-shadow:var(--shadow-soft)}
.formula b{color:var(--ink)}
.formula .tiny{color:#9a816d}
.review{margin-top:16px}
.review summary{cursor:pointer;font-size:14px;font-weight:900;color:#8a4a35;padding:4px 0;list-style:none;user-select:none}
.review summary::-webkit-details-marker{display:none}
.review summary:before{content:"▸";display:inline-block;margin-right:6px;transition:transform .15s}
.review[open] summary:before{transform:rotate(90deg)}
.review>.review-item:first-of-type{margin-top:8px}
.review h3,.panel-h{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900;margin-bottom:8px}
.review-item{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);border-left:4px solid #ffc94d;border-radius:16px;padding:11px 14px;margin-bottom:9px;box-shadow:0 4px 12px rgba(126,84,44,.06)}
.review-item h4{font-size:12px;font-weight:900;color:#b3592c;margin-bottom:3px}
.review-item .rv-opt{font-size:13.5px;font-weight:900}
.review-item .rv-nums{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.65}
.review-item .rv-nums b{color:var(--ink)}
.review-item .rv-risk{font-size:11.5px;color:#a8443b;background:#fff2ef;border-radius:8px;padding:4px 7px;margin-top:5px;display:inline-block}
.leaderboard{margin-top:16px}
.board-mode{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:800;border:1px solid #ffd9c8;color:#b3592c;background:#fff3ea;margin-left:2px}
.board-mode.cloud{border-color:#bfe0ff;color:#2c6a99;background:#eef7ff}
.board-mode.local{border-color:#e8ded2;color:#8a7566;background:#f7f1e8}
.mode-pill{display:inline-flex;align-items:center;border:1px dashed #ffc9b8;border-radius:999px;padding:2px 9px;font-weight:800;font-size:11px;background:#fff8e6;color:#9a5a2d;margin-left:6px}
.board-wrap{overflow-x:auto;border:1px solid rgba(255,255,255,.9);border-radius:16px;background:rgba(255,255,255,.86);box-shadow:var(--shadow-soft)}
.board-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.board-table th{background:#fff6ec;text-align:left;font-size:11px;font-weight:900;color:#9a816d;letter-spacing:.3px;padding:9px 10px;white-space:nowrap;border-bottom:1px solid rgba(74,51,37,.07)}
.board-table td{padding:8px 10px;border-bottom:1px dashed rgba(74,51,37,.08);white-space:nowrap;font-variant-numeric:tabular-nums}
.board-table th:nth-child(n+3),.board-table td:nth-child(n+3){text-align:center}
.board-table td:nth-child(2){max-width:190px;overflow:hidden;text-overflow:ellipsis}
.board-table tr:last-child td{border-bottom:0}
.board-table tr.me td{background:#fff8d6;font-weight:900}
.board-table .rank{font-weight:900;color:#b3592c}
.board-table .prize-mark{font-size:14px}
.board-empty{text-align:center;color:#a08a6c;padding:20px 10px!important}
.board-note{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--ink-soft);line-height:1.55}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.result-actions .btn{flex:1;min-width:150px}

/* ---------------- 弹层 ---------------- */
.modal-backdrop{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(74,51,37,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);overflow-y:auto;animation:fadeIn .18s ease}
.modal{width:min(580px,100%);background:#fffdf9;border:1px solid rgba(255,255,255,.9);border-radius:26px;box-shadow:0 30px 80px rgba(74,51,37,.32);overflow:hidden;animation:modalIn .26s cubic-bezier(.2,1.3,.4,1);max-height:calc(100dvh - 32px);overflow-y:auto}
@keyframes modalIn{from{transform:translateY(22px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 18px;background:linear-gradient(135deg,#fff3d9,#ffe4e1);border-bottom:1px solid #ffe1d4}
.modal-head h3{font-size:16px;font-weight:900;display:flex;align-items:center;gap:7px}
.modal-close{width:34px;height:34px;flex:none;border:1px solid #ffd7c9;background:#fff;border-radius:50%;font-size:15px;font-weight:900;cursor:pointer;display:grid;place-items:center;line-height:1;color:#8a5a50;box-shadow:0 3px 10px rgba(126,84,44,.1)}
.modal-close:active{transform:scale(.94)}
.modal-body{padding:17px 18px 19px}
.ad-meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ad-badge{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:#ffd166;font-size:11px;font-weight:900;letter-spacing:1px;border-radius:7px;padding:2px 8px}
.ad-sponsor{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.ad-timer{font-family:var(--mono);font-size:11px;font-weight:800;color:#b04a3e;background:#fff0ee;border-radius:6px;padding:2px 7px}
.ad-topic{display:inline-block;font-size:11px;font-weight:800;background:#fff3e0;color:#a06a2c;border-radius:999px;padding:2px 9px;margin-bottom:7px}
.ad-stem{font-size:16.5px;font-weight:900;line-height:1.6;margin:4px 0 12px}
.ad-options{display:grid;gap:8px}
.ad-opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid rgba(74,51,37,.1);border-radius:15px;padding:10px 12px;cursor:pointer;font-size:14px;font-weight:700;line-height:1.5;transition:border-color .12s,background .12s,transform .12s;min-height:44px;color:var(--ink)}
.ad-opt:hover{border-color:#ffc9b8;background:#fffdf7}
.ad-opt .opt-line{display:flex;gap:8px;align-items:flex-start}
.ad-opt .opt-mark{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid #ffd9c8;display:grid;place-items:center;font-size:11px;font-weight:900;background:#fff7ee;color:#b3592c}
.ad-opt .opt-text{min-width:0}
.ad-opt.wrong{border-color:#e07c6e;background:#fdeeeb;animation:shake .35s ease}
.ad-opt.wrong .opt-mark{background:#c05a50;color:#fff;border-color:#c05a50}
.ad-opt.correct{border-color:var(--green);background:#e9f8ef}
.ad-opt.correct .opt-mark{background:var(--green);color:#fff;border-color:var(--green)}
.ad-opt .why{display:block;font-size:11.5px;color:#9c4a41;font-weight:600;line-height:1.55;margin-top:4px;padding-left:30px}
.ad-opt .why b{color:#b04a3e}
.ad-opt.correct .why{display:none}
.ad-solved{display:flex;gap:9px;align-items:flex-start;background:#e9f8ef;border:1px solid #bfe9d2;border-radius:15px;padding:11px 13px;margin-top:12px;font-weight:600;color:#2c8662;font-size:13.5px;line-height:1.6}
.ad-solved .big{font-size:19px;line-height:1.2}
.ad-hint{font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-top:10px}
.ad-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(74,51,37,.1)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* 规则 / 二维码 */
.rules-list{display:grid;gap:9px}
.rule{background:#fff;border:1px solid rgba(74,51,37,.08);border-radius:15px;padding:10px 12px}
.rule b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:3px;color:#8a4a35}
.rule span{display:block;font-size:12px;color:var(--ink-soft);line-height:1.6}
.qr-wrap{text-align:center}
.qr-box{display:inline-flex;padding:13px;background:#fff;border:1.5px dashed #ffd0b8;border-radius:20px}
.qr-box svg{width:min(240px,62vw);height:min(240px,62vw)}
.share-url{font-family:var(--mono);font-size:11.5px;background:#fff8ee;border:1px solid #ffe4c8;border-radius:10px;padding:8px 10px;word-break:break-all;color:#8a6a54;margin-top:11px;text-align:left}
.share-tip{font-size:12px;color:var(--ink-soft);line-height:1.65;margin-top:10px;text-align:left}
.share-tip b{color:var(--ink)}
.share-tip.warn{background:#fff4ec;border:1px dashed #f0b6a0;border-radius:12px;padding:9px 11px;color:#8a4a3a}

/* ---------------- 提示 / 彩带 / 页脚 ---------------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);background:rgba(74,51,37,.94);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center;line-height:1.5;box-shadow:0 12px 30px rgba(74,51,37,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;top:-16px;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:.15}}
.footer{text-align:center;font-size:11.5px;color:#a08a76;line-height:1.8;margin-top:26px;padding-top:14px;border-top:1px dashed rgba(74,51,37,.12)}
.footer b{color:#a8443b}
.footer .credit{display:block;margin-top:5px;font-size:10.5px;color:#b8a390;line-height:1.6;max-width:70ch;margin-left:auto;margin-right:auto}

/* ---------------- 响应式 ---------------- */
@media (max-width:940px){
  .game-layout{grid-template-columns:1fr}
  .game-side{order:2}
  .hero-art{width:230px;height:200px}
  .hero-fruit.f1{width:120px;right:36px}
  .hero-fruit.f2{width:76px}
  .hero-fruit.f3{width:60px}
}
@media (max-width:820px){
  .start-grid{grid-template-columns:1fr}
  .hero{padding:24px 22px;align-items:flex-start}
  .hero-art{position:absolute;right:8px;bottom:0;width:180px;height:150px;opacity:.9}
  .hero-copy{max-width:100%}
  .hero h1{max-width:14em}
  .hero-fruit.f1{width:96px;right:20px}
  .hero-fruit.f2{width:60px;right:0;top:0}
  .hero-fruit.f3{display:none}
  .float-sym{display:none}
}
@media (max-width:640px){
  .page{padding:11px 11px calc(40px + var(--safe-b))}
  .festival-bar{font-size:10.5px;padding:6px 10px}
  .brand-logo{width:44px;height:44px;border-radius:14px}
  .brand-name{font-size:18px}
  .brand-sub{font-size:9.5px;letter-spacing:.6px}
  .club-chip{display:none}
  .hero{padding:20px 16px;border-radius:24px;min-height:230px}
  .hero h1{font-size:clamp(24px,7vw,32px)}
  .hero p{font-size:12.5px;line-height:1.7}
  .hero-art{width:132px;height:118px;right:2px;bottom:2px;opacity:.82}
  .hero-fruit.f1{width:82px;right:8px;bottom:0}
  .hero-fruit.f2{width:48px;right:0;top:0}
  .hero-tags{gap:5px;margin-top:10px}
  .hero-tag{font-size:10.5px;padding:3px 9px}
  .card,.round-card{padding:16px 14px;border-radius:22px}
  .hud-item{padding:8px 10px;border-radius:16px}
  .hud-item b{font-size:clamp(16px,4.4vw,20px)}
  .name-stage{gap:8px}
  .name-avatar-wrap{width:34px;height:34px;border-radius:10px;padding:3px}
  .name-display{padding:8px;gap:6px}
  .name-text{font-size:15.5px;line-height:1.35;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dice{width:56px;border-radius:16px;font-size:27px}
  .start-actions .row .btn{min-width:0}
  .goal{gap:10px;padding:10px 12px}
  .goal-num{font-size:32px;padding:5px 10px 7px}
  .choice{padding:12px 12px;border-radius:16px}
  .choice-head{flex-wrap:wrap;gap:4px}
  .cost{margin-left:auto;font-size:11px;padding:3px 8px}
  .score-grid{grid-template-columns:1fr 1fr}
  .score-card b{font-size:20px}
  .result-hero{padding:24px 16px 18px;border-radius:24px}
  .result-mascot-wrap{width:100px;height:100px;right:8px;bottom:4px;opacity:.7}
  .score-big{font-size:clamp(54px,14vw,72px)}
  .voucher{grid-template-columns:1fr;justify-items:center;text-align:center}
  .voucher-info{width:100%}
  .voucher-row{justify-content:space-between}
  .result-actions{flex-direction:column}
  .result-actions .btn{width:100%;min-width:0}

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

"简化模型会降低可信度，应尽量避免","whyWrong":"合理简化抓住主要因素，反而让模型更可用。"},{"text":"抓住主要因素，先做简化模型","whyWrong":null},{"text":"模型越复杂越能体现建模水平","whyWrong":"复杂度不是目的，能解决问题的模型才是好模型。"}],"answer":2,"explain":"先抓住主要矛盾做简化模型，跑通后再逐步增加细节，是常见建模路径。"},{"id":"q04","topic":"目标与约束","stem":"关于优化模型中的目标和约束，哪种说法正确？","options":[{"text":"约束越多越好，可以随便加","whyWrong":"无关约束会缩小可行域，甚至排除真正的最优解。"},{"text":"目标函数和约束条件是一回事","whyWrong":"目标是要优化的量，约束是必须满足的条件。"},{"text":"只要约束满足，目标不重要","whyWrong":"约束保证方案可行，目标才决定方案好坏。"},{"text":"目标是优化的量，约束限定可行范围","whyWrong":null}],"answer":3,"explain":"优化模型就是在约束划定的可行域内，让目标函数取到最优值。"},{"id":"q05","topic":"目标与约束","stem":"资源有限时要让某个指标最高，这属于哪类优化问题？","options":[{"text":"带约束的优化问题","whyWrong":null},{"text":"这类问题没有约束条件","whyWrong":"资源有限本身就是约束，不能当成无约束问题。"},{"text":"目标函数在优化里可有可无","whyWrong":"没有目标函数就无法比较不同方案的优劣。"},{"text":"约束条件比目标函数更重要","whyWrong":"两者缺一不可，目标决定优化的方向。"}],"answer":0,"explain":"资源有限、目标明确时通常是带约束优化：在可行域内寻找最优方案。"},{"id":"q06","topic":"线性规划","stem":"关于线性规划模型，下面哪条说法正确？","options":[{"text":"线性规划适合处理随机问题","whyWrong":"线性规划是确定性模型，随机问题要用随机规划等方法。"},{"text":"目标函数与约束都是线性的","whyWrong":null},{"text":"线性规划的约束可以不含未知数","whyWrong":"约束应含决策变量，否则无法限定可行域。"},{"text":"线性规划只能求最小值","whyWrong":"目标既可最大化也可最小化，取决于问题。"}],"answer":1,"explain":"线性规划要求目标函数和约束条件都是决策变量的线性表达式。"},{"id":"q07","topic":"线性规划","stem":"关于线性规划中的可行域，下面哪条说法正确？","options":[{"text":"可行域就是最优解所在的那个点","whyWrong":"最优解只是一个点，可行域是所有可行解的集合。"},{"text":"可行域只由变量的取值范围决定","whyWrong":"可行域由全部约束共同决定，不只变量范围。"},{"text":"满足全部约束条件的解集合","whyWrong":null},{"text":"可行域通常是一条直线","whyWrong":"多变量问题中可行域是多维区域，不是直线。"}],"answer":2,"explain":"可行域是所有满足约束的解组成的集合，最优解一定在可行域内取得。"},{"id":"q08","topic":"优化模型","stem":"班次数量、车辆数这类必须取整的决策，应使用什么模型？","options":[{"text":"先求连续解，随便取整即可","whyWrong":"直接取整可能违反约束，甚至不再是可行解。"},{"text":"取期望值当实际整数即可","whyWrong":"期望不是整数，不能直接当可执行方案。"},{"text":"人工试凑是唯一可行办法","whyWrong":"整数规划有系统算法，不必全靠试凑。"},{"text":"整数规划，决策变量取整数","whyWrong":null}],"answer":3,"explain":"决策变量必须为整数时用整数规划，0-1 规划是它最常见的特例。"},{"id":"q09","topic":"优化模型","stem":"多目标互相冲突、无法同时最优时，常用什么思路？","options":[{"text":"找互不支配的帕累托解集","whyWrong":null},{"text":"只保留最重要的一个目标","whyWrong":"只保一个目标会直接牺牲其他目标，不够全面。"},{"text":"把各目标数值直接相加","whyWrong":"量纲不同直接相加没有意义，须先统一尺度。"},{"text":"随机丢掉一个目标再求解","whyWrong":"丢目标会丢失信息，多目标问题应先权衡。"}],"answer":0,"explain":"多目标优化常先求帕累托解集，再结合决策者偏好从折中方案中选一个。"},{"id":"q10","topic":"优化模型","stem":"目标或约束含非线性关系时，建模求解要注意什么？","options":[{"text":"仍然可以直接用线性规划求解","whyWrong":"线性规划要求线性关系，非线性下不适用。"},{"text":"可能有多个局部最优，解要谨慎","whyWrong":null},{"text":"非线性模型一定有唯一最优解","whyWrong":"非线性模型可能有多个局部最优，甚至无解。"},{"text":"非线性问题只能求近似值","whyWrong":"很多非线性问题可以精确求解，不能一概而论。"}],"answer":1,"explain":"非线性优化容易陷入局部最优，求出的解要结合算法性质判断是否可信。"},{"id":"q11","topic":"排队论","stem":"关于排队论中的到达率和服务率，哪条说法正确？","options":[{"text":"到达率越高，队伍一定越短","whyWrong":"到达率越高，队列通常越长，而不是越短。"},{"text":"服务率越高，队伍一定越长","whyWrong":"服务率越高，队列通常越短，而不是越长。"},{"text":"服务率高于到达率时系统更稳定","whyWrong":null},{"text":"两个比率与等待时间无关","whyWrong":"等待时间正是由到达率和服务率共同决定的。"}],"answer":2,"explain":"服务能力大于到达速度时队伍不会无限增长，这是排队系统稳定的条件。"},{"id":"q12","topic":"排队论","stem":"关于排队系统的性能指标，下面哪条说法正确？","options":[{"text":"排队系统只需统计窗口数量","whyWrong":"窗口数只是服务能力，还要看到达率与等待时间。"},{"text":"等待时间越短，利用率一定越高","whyWrong":"等待短可能因为需求低，利用率未必更高。"},{"text":"排队论只适用于单一服务台","whyWrong":"排队论也研究多服务台、多队列等系统，不只单一服务台。"},{"text":"平均队长和平均等待时间是常用指标","whyWrong":null}],"answer":3,"explain":"平均队长、平均等待时间、系统利用率是排队论最常用的性能指标。"},{"id":"q13","topic":"概率统计","stem":"建模时对随机现象做概率假设，哪种说法正确？","options":[{"text":"用分布刻画随机性，需检验假设","whyWrong":null},{"text":"随机现象无法用模型描述","whyWrong":"随机性可用概率分布描述，正是概率建模的用途。"},{"text":"假设分布后就不必再验证","whyWrong":"分布假设要用数据检验，否则结论可能失真。"},{"text":"概率模型的结论一定精确","whyWrong":"概率模型给的是概率意义上的结论，不是精确值。"}],"answer":0,"explain":"概率模型用分布描述随机性，假设是否合理要靠数据检验。"},{"id":"q14","topic":"概率统计","stem":"关于期望与方差，下面哪条说法正确？","options":[{"text":"期望越大，方差也一定越大","whyWrong":"期望和方差是两回事，大小没有必然联系。"},{"text":"方差衡量数据相对期望的波动","whyWrong":null},{"text":"方差为 0 说明数据很分散","whyWrong":"方差为 0 说明数据都等于期望，非常集中。"},{"text":"期望一定等于某个观测值","whyWrong":"期望是加权平均，未必等于任何实际观测值。"}],"answer":1,"explain":"期望描述平均水平，方差描述数据偏离期望的波动程度。"},{"id":"q15","topic":"概率统计","stem":"用样本估计总体参数时，哪种做法更稳妥？","options":[{"text":"样本越少，估计越稳定","whyWrong":"样本越少估计波动越大，通常更不稳定。"},{"text":"样本怎么取都一样，不影响估计","whyWrong":"样本偏差会直接带偏估计，取法非常关键。"},{"text":"随机抽样并给出置信区间","whyWrong":null},{"text":"只报点估计就足够准确","whyWrong":"点估计缺少误差信息，置信区间能反映不确定性。"}],"answer":2,"explain":"随机抽样保证代表性，置信区间说明估计的不确定范围。"},{"id":"q16","topic":"回归拟合","stem":"关于线性回归拟合，下面哪条说法正确？","options":[{"text":"R² 越高，模型一定越好","whyWrong":"R² 会随变量增加而升高，不能只看它判断好坏。"},{"text":"残差越大说明拟合越好","whyWrong":"残差大说明拟合差，好模型的残差应较小。"},{"text":"回归只能预测，不能解释关系","whyWrong":"回归既能预测，也能解释变量之间的关系。"},{"text":"残差应尽量小且没有明显规律","whyWrong":null}],"answer":3,"explain":"好的拟合残差应小且不呈现系统模式，否则说明模型遗漏了重要信息。"},{"id":"q17","topic":"回归拟合","stem":"训练集表现完美、换新数据却很差，最可能是哪种问题？","options":[{"text":"过拟合，把噪声也学了进去","whyWrong":null},{"text":"欠拟合，模型太简单","whyWrong":"欠拟合在训练集上就表现不好，与题意相反。"},{"text":"说明数据完全没有规律","whyWrong":"训练集能拟合说明存在规律，问题在泛化能力。"},{"text":"增加模型复杂度就能解决","whyWrong":"继续加复杂度会加重过拟合，应正则化或简化。"}],"answer":0,"explain":"训练好、测试差是过拟合的典型信号，可加正则化或减少变量。"},{"id":"q18","topic":"评价模型","stem":"用层次分析法（AHP）确定指标权重，正确做法是？","options":[{"text":"指标越多，权重一定算得越准","whyWrong":"指标过多会增加判断负担，也更容易不一致。"},{"text":"做一致性检验，避免判断自相矛盾","whyWrong":null},{"text":"权重可以随意指定，不用检验","whyWrong":"随意指定缺乏依据，AHP 要求判断矩阵合理。"},{"text":"AHP 只能用于定量数据","whyWrong":"AHP 正适合把定性判断定量化，不排斥定性指标。"}],"answer":1,"explain":"AHP 通过两两比较构造判断矩阵，并用一致性检验筛掉矛盾的打分。"},{"id":"q19","topic":"评价模型","stem":"多指标综合评价前统一量纲，下面哪条说法正确？","options":[{"text":"归一化会损失变量之间的关系","whyWrong":"归一化只改变尺度，不改变变量间的相对关系。"},{"text":"量纲不同也可以直接加权相加","whyWrong":"量纲不同直接相加没有意义，结果不可解释。"},{"text":"归一化让不同指标可以比较","whyWrong":null},{"text":"标准化后数据就失去意义","whyWrong":"标准化只是统一尺度，数据信息仍然保留。"}],"answer":2,"explain":"量纲不同的指标不能直接相加，先归一化才能进行综合加权。"},{"id":"q20","topic":"预测模型","stem":"关于灰色预测 GM(1,1)，下面哪条说法正确？","options":[{"text":"它需要大规模样本才有效","whyWrong":"灰色预测的优势正是小样本，不依赖大样本。"},{"text":"它只能处理完全随机的数据","whyWrong":"灰色模型针对信息不完全的系统，不是纯随机。"},{"text":"它不需要任何历史数据","whyWrong":"灰色预测要基于历史序列建模，不能没有数据。"},{"text":"它适合小样本、趋势性预测","whyWrong":null}],"answer":3,"explain":"GM(1,1) 用小样本的累加生成弱化随机性，适合短期趋势预测。"},{"id":"q21","topic":"预测模型","stem":"用时间序列做预测，建模前最该先确认什么？","options":[{"text":"先看数据是否有趋势或季节性","whyWrong":null},{"text":"预测模型越复杂越准确","whyWrong":"复杂度不等于准确，应先看数据特征再选模型。"},{"text":"时间序列不需要历史数据","whyWrong":"时间序列预测必须基于历史观测序列。"},{"text":"预测误差无法评估","whyWrong":"预测误差可以用 MAE、RMSE 等指标评估。"}],"answer":0,"explain":"先识别趋势、季节和周期等特征，再选择对应的时间序列模型。"},{"id":"q22","topic":"图论","stem":"关于图论最短路问题，下面哪条说法正确？","options":[{"text":"最短路就是边数最少的路径","whyWrong":"最短路看总权重，不一定是边数最少的路径。"},{"text":"有负权边时要选合适的算法","whyWrong":null},{"text":"最短路问题没有通用算法","whyWrong":"最短路有成熟算法，如 Dijkstra、Floyd 等。"},{"text":"所有边的权重必须都相等","whyWrong":"权重可以各不相同，最短路正是处理加权图的。"}],"answer":1,"explain":"Dijkstra 适合非负权；存在负权边时要用 Bellman-Ford 等方法。"},{"id":"q23","topic":"图论","stem":"用图论给道路网络建模，节点和边分别对应什么？","options":[{"text":"节点是道路，边是路口","whyWrong":"说反了，通常路口是节点、道路才是边。"},{"text":"节点是时间，边是距离","whyWrong":"节点应表示对象或位置，不是时间。"},{"text":"节点是路口，边是道路","whyWrong":null},{"text":"节点和边可以任意指定","whyWrong":"节点和边对应现实对象，随意指定会让模型失真。"}],"answer":2,"explain":"把路口抽象成节点、道路抽象成带权边，才能用图论算法求最优路径。"},{"id":"q24","topic":"微分方程","stem":"关于微分方程建模，下面哪条说法正确？","options":[{"text":"解的形式越复杂，模型越准确","whyWrong":"解复杂不等于贴合实际，关键看机制与数据。"},{"text":"微分方程只能描述物理现象","whyWrong":"它也用于生态、经济、传播等众多领域。"},{"text":"参数不需要估计，直接给定即可","whyWrong":"参数通常要从数据估计，随意给定会让结论失真。"},{"text":"核心是写出变量间的变化率关系","whyWrong":null}],"answer":3,"explain":"微分方程建模的核心，是写出各变量变化率之间的定量关系。"},{"id":"q25","topic":"微分方程","stem":"关于 SIR 传播模型，下面哪条说法正确？","options":[{"text":"把人群分为易感、感染、康复三类","whyWrong":null},{"text":"三个字母代表三种治疗药物","whyWrong":"SIR 描述人群状态分类，不是药物名称。"},{"text":"它只能描述一个人","whyWrong":"SIR 描述人群数量变化，不是单个人。"},{"text":"它不需要任何参数","whyWrong":"模型含传染率、康复率等参数，需要估计。"}],"answer":0,"explain":"SIR 用三类人群的数量变化，刻画传播过程随时间演化的规律。"},{"id":"q26","topic":"随机模拟","stem":"关于蒙特卡洛模拟，下面哪条说法正确？","options":[{"text":"它一次计算就能得到精确解","whyWrong":"蒙特卡洛靠大量随机试验逼近，不是精确解。"},{"text":"用大量随机试验逼近结果","whyWrong":null},{"text":"它只适合确定性模型","whyWrong":"蒙特卡洛正适合处理随机性和复杂问题。"},{"text":"采样点越少，结果越准确","whyWrong":"采样越多估计通常越稳定，不是越少越准。"}],"answer":1,"explain":"蒙特卡洛通过大量随机试验的统计结果逼近目标值，误差随样本增加而下降。"},{"id":"q27","topic":"随机模拟","stem":"用蒙特卡洛估算不规则图形面积，基本思路是什么？","options":[{"text":"随机点撒得越少，估计越精确","whyWrong":"样本越少随机误差越大，估计通常更不准。"},{"text":"蒙特卡洛只能估计一维问题","whyWrong":"它可用于多维积分、面积等，不局限一维。"},{"text":"统计落入图形的随机点比例","whyWrong":null},{"text":"它需要事先知道精确答案","whyWrong":"正因为不知道答案才用模拟估计，不需要先知。"}],"answer":2,"explain":"落在图形内的随机点比例乘以区域总面积，即为面积的蒙特卡洛估计。"},{"id":"q28","topic":"启发式算法","stem":"关于遗传算法，下面哪条说法正确？","options":[{"text":"它一定能找到全局最优解","whyWrong":"遗传算法是启发式方法，不保证全局最优。"},{"text":"它不需要编码和适应度函数","whyWrong":"遗传算法要先编码，并定义适应度函数。"},{"text":"它属于精确算法，没有随机性","whyWrong":"遗传算法含随机选择与变异，不是精确算法。"},{"text":"它模拟选择、交叉、变异来搜索","whyWrong":null}],"answer":3,"explain":"遗传算法把解编码成个体，通过选择、交叉、变异迭代逼近较好的解。"},{"id":"q29","topic":"启发式算法","stem":"关于模拟退火算法，下面哪条说法正确？","options":[{"text":"允许暂时接受差解，跳出局部最优","whyWrong":null},{"text":"温度越高，搜索越接近收敛","whyWrong":"温度高时搜索更随机，温度下降才逐渐收敛。"},{"text":"它只接受更好的解","whyWrong":"只接受更好解就退化成爬山法，容易卡在局部最优。"},{"text":"它保证结果一定是最优解","whyWrong":"模拟退火是启发式方法，不保证全局最优。"}],"answer":0,"explain":"退火初期允许接受差解扩大探索，温度降低后逐步收敛到较好解。"},{"id":"q30","topic":"启发式算法","stem":"关于启发式算法，下面哪条说法更准确？","options":[{"text":"启发式算法的结果一定最优","whyWrong":"启发式追求可行好解，通常不保证最优。"},{"text":"适合求复杂问题的较好可行解","whyWrong":null},{"text":"启发式算法不需要评价标准","whyWrong":"要有适应度或目标值来判断解的好坏。"},{"text":"启发式算法只能处理连续问题","whyWrong":"启发式也能处理离散与组合优化问题。"}],"answer":1,"explain":"NP 难问题常缺乏快速精确算法，启发式能在可接受时间内给出不错的可行解。"},{"id":"q31","topic":"灵敏度分析","stem":"关于灵敏度分析，下面哪条说法正确？","options":[{"text":"它用来把复杂模型变简单","whyWrong":"它检验参数影响，不负责简化模型。"},{"text":"它只在建模全部结束后才需要","whyWrong":"建模中期也可用它判断关键参数，不限于结束前。"},{"text":"观察参数变化对结论的影响","whyWrong":null},{"text":"它要求所有参数都精确已知","whyWrong":"灵敏度分析正是研究参数不确定时结论稳不稳。"}],"answer":2,"explain":"灵敏度分析看参数小幅变动时结论是否稳定，帮助识别关键参数。"},{"id":"q32","topic":"灵敏度分析","stem":"灵敏度分析发现结论对某参数极其敏感，合理应对是？","options":[{"text":"删掉这个参数，假装不存在","whyWrong":"删掉会掩盖关键影响，让模型失真。"},{"text":"忽略结果，照常给出结论","whyWrong":"忽略敏感信号会让结论不可靠。"},{"text":"把参数随便改成一个整数","whyWrong":"随意取值缺乏依据，应核实来源与精度。"},{"text":"重点核实该参数的取值","whyWrong":null}],"answer":3,"explain":"敏感参数是结论可靠性的关键，应   function makeName() {
    var a = pick(ADJ);

    var guard = 0;
    while (b === a && guard < 12) { b = pick(ADJ); guard++; }
    var fruit = pick(FRUITS);
    var num = randInt(NUMBER_MIN, NUMBER_MAX);
    return { text: a + '且' + b + '的' + fruit + num, adj1: a, adj2: b, fruit: fruit, number: num };
  }
  function newName() {
    var n = makeName();
    var guard = 0;
    while (n.text === state.name && guard < 10) { n = makeName(); guard++; }
    state.name = n.text;
    return n.text;
  }
  function updateNameDom() {
    var t = $('#nameText');
    if (t) t.textContent = state.name;
  }
  function animateNameRoll(done) {
    if (state.rolling) return;
    state.rolling = true;
    var dice = $('.dice');
    var textEl = $('#nameText');
    if (dice) dice.classList.add('is-rolling');
    if (textEl) textEl.classList.add('is-rolling');
    var ticks = 0;
    var timer = setInterval(function () {
      newName();
      updateNameDom();
      ticks++;
      if (ticks >= 10) {
        clearInterval(timer);
        state.rolling = false;
        var d2 = $('.dice');
        if (d2) d2.classList.remove('is-rolling');
        var t2 = $('#nameText');
        if (t2) t2.classList.remove('is-rolling');
        if (typeof done === 'function') done();
      }
    }, 65);
  }

  /* ----------------------------- 结算 ----------------------------- */
  function settle(run) {
    var sat = clamp(Math.round(run.metrics.sat), 0, 100);
    var build = clamp(Math.round(run.metrics.build), 0, 100);
    var teach = clamp(Math.round(run.metrics.teach), 0, 100);
    var budget = Math.round(run.budget);
    var cashTotal = Math.round(run.cashTotal);
    var finance = clamp(Math.round(FIN.base + budget * FIN.budgetFactor + cashTotal * FIN.cashFactor), 0, 100);
    var minM = Math.min(sat, build, teach);
    var bonus = Math.min(BB.cap, Math.floor(Math.max(0, minM - BB.threshold) / BB.step) * BB.perStep);
    var raw = sat * W.sat + build * W.build + teach * W.teach + finance * W.finance + bonus;
    var score = clamp(Math.round(raw), 0, 100);
    var title = TITLES[0];
    for (var i = 0; i < TITLES.length; i++) {
      if (score >= TITLES[i].min) { title = TITLES[i]; break; }
    }
    var prize = score >= PRIZE;
    var ts = Date.now();
    return {
      id: ts + '-' + Math.random().toString(36).slice(2, 7),
      ts: ts,
      name: run.name,
      score: score,
      sat: sat,
      build: build,
      teach: teach,
      finance: finance,
      bonus: bonus,
      prize: prize,
      title: title,
      budget: budget,
      cashTotal: cashTotal,
      spentCost: run.spentCost,
      event: run.event,

      code: prize ? makeVoucherCode(run.name, ts, score) : ''

  }
  function makeVoucherCode(name, ts, score) {
    var s = name + '|' + ts + '|' + score + '|nl-v2';
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    var b = (h >>> 0).toString(36).toUpperCase();
    while (b.length < 8) b = '0' + b;

  /* ----------------------------- 排行榜 ----------------------------- */
  function sortBoard(arr) {
    return arr.slice().sort(function (a, b) {
      return (b.score - a.score) || ((a.ts || 0) - (b.ts || 0));
    }).slice(0, MAX_BOARD_LOCAL);
  }
  function localBoard() {
    try {
      var a = JSON.parse(localStorage.getItem(BOARD_KEY) || '[]');
      return Array.isArray(a) ? a : [];
    } catch (e) { return []; }
  }
  function saveLocal(arr) {
    try { localStorage.setItem(BOARD_KEY, JSON.stringify(arr.slice(0, MAX_BOARD_LOCAL))); } catch (e) { /* 隐私模式忽略 */ }
  }
  function cloudEnabled() {
    return !!(CLOUD && CLOUD.enabled && CLOUD.endpoint && CLOUD.user && CLOUD.secret);
  }
  function cloudPost(params) {
    var body = new URLSearchParams();
    body.set('user', CLOUD.user);
    body.set('secret', CLOUD.secret);
    Object.keys(params).forEach(function (k) { body.set(k, params[k]); });
    return fetch(CLOUD.endpoint, { method: 'POST', body: body, cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('cloud HTTP ' + res.status);
      return res.text();
    });
  }
  function parseCloudBoard(text) {
    var obj = JSON.parse(text);
    var arr = [];
    Object.keys(obj || {}).forEach(function (k) {
      if ((CLOUD.prefix || '') && k.indexOf(CLOUD.prefix) !== 0) return;
      try {
        var v = JSON.parse(obj[k]);
        if (!v || typeof v.s !== 'number' || typeof v.n !== 'string') return;
        arr.push({
          name: String(v.n).slice(0, 20),
          score: clamp(Math.round(v.s), 0, 100),
          sat: clamp(Math.round(v.a || 0), 0, 100),
          build: clamp(Math.round(v.b || 0), 0, 100),
          teach: clamp(Math.round(v.c || 0), 0, 100),
          finance: clamp(Math.round(v.f || 0), 0, 100),
          prize: !!v.p,
          ts: Number(v.t) || 0
        });
      } catch (e) { /* 跳过坏数据 */ }
    });
    return sortBoard(arr);
  }
  async function loadCloudBoard() {
    var text = await cloudPost({
      action: 'search', no: '1', count: String(Math.max(20, CLOUD.max || 60)),
      tag: CLOUD.prefix || 'nlm2_', type: 'both'
    });
    state.board = parseCloudBoard(text);
    state.boardMode = 'cloud';
    state.boardNote = '';
  }
  async function submitCloudBoard(entry) {
    var tag = (CLOUD.prefix || 'nlm2_') + Number(entry.ts).toString(36) + '_' + Math.random().toString(36).slice(2, 6);
    var value = {
      n: entry.name, s: entry.score, t: entry.ts, p: entry.prize ? 1 : 0,
      a: entry.sat, b: entry.build, c: entry.teach, f: entry.finance
    };
    await cloudPost({ action: 'update', tag: tag, value: JSON.stringify(value) });
    await loadCloudBoard();
  }
  async function loadBoard() {
    if (location.protocol === 'file:') {
      state.board = localBoard();
      state.boardMode = 'local';
      return;
    }
    try {
      var res = await fetch('api/board', { cache: 'no-store', headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var j = await res.json();
      if (!j || !j.ok || !Array.isArray(j.board)) throw new Error('bad payload');
      state.board = j.board;
      state.boardMode = 'online';
      state.boardNote = '';
      if (j.lanUrl) state.lanUrl = j.lanUrl;
      return;
    } catch (e) { /* 静态部署没有 /api/board，继续尝试线上榜 */ }
    if (cloudEnabled()) {
      try { await loadCloudBoard(); return; } catch (e2) { state.boardNote = '线上排行榜暂时连不上，已切换本机排行榜。'; }
    }

  async function saveOutcome(o) {

      name: o.name, score: o.score, sat: o.sat, build: o.build, teach: o.teach,
      finance: o.finance, prize: o.prize, ts: o.ts
    };
    if (state.boardMode === 'online' && location.protocol !== 'file:') {
      try {
        var res = await fetch('api/board', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(entry)
        });
        var j = await res.json().catch(function () { return null; });
        if (res.ok && j && j.ok && Array.isArray(j.board)) {
          state.board = j.board;
          state.boardMode = 'online';
          return;
        }
      } catch (e) { /* 尝试线上榜 */ }

      try { await submitCloudBoard(entry); return; } catch (e) { state.boardNote = '线上排行榜提交失败，本局已记录到本机。'; }

    saveLocal(state.board);
    state.boardMode = 'local';
  }
