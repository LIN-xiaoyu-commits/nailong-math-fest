      '<div class="ad-meta"><span class="ad-sponsor">数学建模小知识</span></div>' +
      '<div class="ad-stem">' + esc(q.stem) + '</div>' +
      '<div class="ad-options">' + ad.order.map(function (actual, disp) { return adOptionHTML(q.options[actual], disp, actual); }).join('') + '</div>' +
      (solved
        ? '<div class="ad-solved"><span class="big">✅</span><span>答对了。' + esc(q.explain || '继续吧。') + '</span></div>'
        : '<div class="ad-hint">' + (ad.tried.length ? '点错了，可以再选一个；红色选项的错因会保留。' : '答错会显示正确答案和错因，可以改。') + '</div>') +
      '<div class="ad-foot">' +
      '<button type="button" class="link-btn" data-act="ad-cancel">不看了</button>' +
      (solved ? '<button type="button" class="btn btn-primary" data-act="ad-continue">继续</button>' : '') +
      '</div>' +
      '</div></div>';
    return inner;
  }
  function openAdModal(onPass, successMsg) {
    var q = pickQuestion();
    state.ad = {
      q: q,
      order: shuffle(q.options.map(function (_, i) { return i; })),
      tried: [],
      solved: false,
      onPass: onPass,
      successMsg: successMsg || '新的一局开始了'
    };
    showModal(adModalHTML(), { closable: false });
  }
  function answerAd(displayIndex) {
    var ad = state.ad;
    if (!ad || ad.solved) return;
    var q = ad.q;
    var actual = ad.order[displayIndex];
    if (actual == null) return;
    if (actual === q.answer) {
      ad.solved = true;
    } else if (ad.tried.indexOf(actual) === -1) {
      ad.tried.push(actual);
    }
    showModal(adModalHTML(), { closable: false });
  }
  function cancelAd() {
    state.ad = null;
    closeModal();
    toast('已取消');
  }
  function continueFromAd() {
    var ad = state.ad;
    if (!ad || !ad.onPass) return;
    var cb = ad.onPass;
    var msg = ad.successMsg;
    state.ad = null;
    closeModal();
    toast(msg);
    cb();
  }

  /* ----------------------------- 流程 ----------------------------- */
  function pickEvent() {
    if (!EVENTS.length) return { id: 'calm', emoji: '🌤️', title: '平静开学', desc: '这学期的开局很平稳，没有额外惊喜。', budget: 0, sat: 0, build: 0, teach: 0 };
    var ev = pick(EVENTS);
    var guard = 0;
    while (EVENTS.length > 1 && ev.id === state.lastEventId && guard < 12) { ev = pick(EVENTS); guard++; }
    state.lastEventId = ev.id;
    return ev;
  }
  function beginRun() {
    var ev = pickEvent();
    var startBudget = START_BUDGET + (Number(ev.budget) || 0);
    var need = Math.min(6, ROUNDS.length);
    // 每局从场景题库中随机抽 6 个，并随机打乱选项顺序
    var roundOrder = shuffle(ROUNDS.map(function (_, i) { return i; })).slice(0, need);
    var optionOrders = roundOrder.map(function (ri) {
      return shuffle(ROUNDS[ri].options.map(function (_, k) { return k; }));
    });
    state.run = {
      name: state.name,
      event: ev,
      startBudget: startBudget,
      budget: startBudget,
      roundOrder: roundOrder,
      optionOrders: optionOrders,
      metrics: {
        sat: BASE.sat + (Number(ev.sat) || 0),
        build: BASE.build + (Number(ev.build) || 0),
        teach: BASE.teach + (Number(ev.teach) || 0)
      },
      records: [],
      index: 0,
      locked: false,
      cashTotal: 0,
      spentCost: 0,
      outcome: null
    };
    // 新的一局开始后，上一局的「看广告重玩」门槛自动失效
    state.last = null;
    state.screen = 'game';
    closeModal();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function needsGate() {
    return !!(state.last && state.last.score < PRIZE);
  }
  function requestStart() {
    if (needsGate()) {
      openAdModal(function () { beginRun(); }, '新的一局开始了');
    } else {
      beginRun();
    }
  }
  function requestRetry() {
    if (needsGate()) {
      openAdModal(function () { beginRun(); }, '再来一局');
    } else {
      beginRun();
    }
  }
  function requestNewPlayer() {
    var go = function () {
      // 广告题已经作为「重玩门槛」通过，这里清掉旧成绩，避免回到首页再开一局时被重复拦截
      state.last = null;
      newName();
      state.screen = 'start';
      state.run = null;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    if (needsGate()) {
      openAdModal(go, '换一位校长');
    } else {
      go();
    }
  }
  function goHome() {
    state.screen = 'start';
    state.run = null;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function rollOutcome(opt) {
    var sat = rndRange(opt.sat);
    var build = rndRange(opt.build);
    var teach = rndRange(opt.teach);
    var cash = rndRange(opt.cash || [0, 0]);
    var riskFired = false;
    if (opt.risk && Math.random() < opt.risk.p) {
      riskFired = true;
      sat += Number(opt.risk.sat) || 0;
      build += Number(opt.risk.build) || 0;
      teach += Number(opt.risk.teach) || 0;
      cash += Number(opt.risk.cash) || 0;
    }
    return {
      sat: sat, build: build, teach: teach, cash: cash, cost: opt.cost,
      riskFired: riskFired, risk: opt.risk || null,
      optionTitle: opt.title, optionId: opt.id
    };
  }
  function chooseOption(i) {
    var run = state.run;
    if (!run || run.locked) return;
    var round = roundAt(run, run.index);
    var opt;
    if (i < 0) {
      // 预算见底时的兜底方案：不花钱，随机获得极小收益
      opt = { id: 'fallback', title: '维持现状', cost: 0, sat: [0, 1], build: [0, 1], teach: [0, 1], cash: [0, 0], risk: null, note: '' };
    } else {
      var actual = run.optionOrders[run.index][i];
      opt = round.options[actual];
    }
    if (!opt) return;
    if (opt.cost > run.budget) { toast('💰 预算不够啦，换一个更便宜的方案'); return; }
    run.locked = true;
    var picked = $('.choice[data-i="' + i + '"]');
    if (picked) picked.classList.add('is-picked');
    var out = rollOutcome(opt);
    run.records.push({
      roundIndex: run.roundOrder[run.index], roundId: round.id, optionIndex: i, optionTitle: out.optionTitle,
      sat: out.sat, build: out.build, teach: out.teach, cash: out.cash, cost: opt.cost,
      riskFired: out.riskFired, risk: out.risk
    });
    // 风险可能导致「花的比余额多」，预算最低记为 0（财务健康按 0 计）
    run.budget = Math.max(0, run.budget + out.cash - opt.cost);
    run.cashTotal += out.cash;
    run.spentCost += opt.cost;
    run.metrics.sat += out.sat;
    run.metrics.build += out.build;
    run.metrics.teach += out.teach;
    // 更新 HUD + 锁定按钮
    var bv = $('#budgetVal'), sv = $('#spentVal');
    if (bv) bv.innerHTML = dash(run.budget) + ' <span class="unit">万元</span>';
    if (sv) sv.innerHTML = dash(run.spentCost) + ' <span class="unit">万元</span>';
    var box = $('#budgetHud');
    if (box) { box.classList.remove('flash'); void box.offsetWidth; box.classList.add('flash'); }
    document.querySelectorAll('.choice').forEach(function (b) { b.disabled = true; b.classList.add('is-locked'); });
    showSeal();
    setTimeout(function () {
      removeSeal();
      run.index += 1;
      run.locked = false;
      if (run.index >= run.roundOrder.length) {
        finishRun();
      } else {
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }, 780);
  }
  function showSeal() {
    var d = document.createElement('div');
    d.className = 'seal-overlay';
    d.id = 'sealOverlay';
    d.innerHTML = '<div class="seal-stamp"><span class="seal-icon">🔒</span><div class="seal-main">已记账 · 结果封存</div><div class="seal-sub">学期末统一揭晓 · 正在进入下一关</div></div>';
    document.body.appendChild(d);
  }
  function removeSeal() {
    var d = $('#sealOverlay');
    if (d) d.remove();
  }
  async function finishRun() {
    var run = state.run;
    var outcome = settle(run);
    run.outcome = outcome;
    state.last = outcome;
    state.screen = 'result';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (outcome.prize) confetti();
    try { await saveOutcome(outcome); } catch (e) { /* 忽略存储异常 */ }
    updateBoardDom(outcome);
  }
  function confetti() {
    var colors = ['#ffcf45', '#f3a23a', '#56b08d', '#78aee8', '#e995aa', '#fff7e6'];
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('span');
      s.className = 'confetti';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      s.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      document.body.appendChild(s);
      (function (node) { setTimeout(function () { node.remove(); }, 3800); })(s);
    }
  }

  /* ----------------------------- 提示 ----------------------------- */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ----------------------------- 渲染与事件 ----------------------------- */
  function animateScore(target) {
    var el = $('.score-big');
    if (!el) return;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    var start = performance.now();
    var dur = 850;
    function frame(now) {
      var p = Math.min(1, (now - start) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      var v = Math.round(target * eased);
      el.innerHTML = v + '<small> / 100</small>';
      if (p < 1) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  function render() {
    var html = '';
    if (state.screen === 'start') html = startHTML();
    else if (state.screen === 'game') html = gameHTML();
    else if (state.screen === 'result') html = resultHTML();
    var app = $('#app');
    if (app) app.innerHTML = html;
    document.title = state.screen === 'result'
      ? '学期总结 · 奶龙大学'
      : (state.screen === 'game' ? '第 ' + (state.run ? state.run.index + 1 : 1) + ' 关 · 奶龙大学' : '奶龙大学 · 校园建设模拟赛');
    if (state.screen === 'result' && state.run && state.run.outcome) animateScore(state.run.outcome.score);
  }
  function handleClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var act = el.getAttribute('data-act');
    switch (act) {
      case 'roll-name': animateNameRoll(); break;
      case 'start': requestStart(); break;
      case 'retry': requestRetry(); break;
      case 'new-player': requestNewPlayer(); break;
      case 'home': goHome(); break;
      case 'share': openQrModal(); break;
      case 'rules': openRulesModal(); break;
      case 'choose': chooseOption(Number(el.getAttribute('data-i'))); break;
      case 'close-modal': closeModal(); break;
      case 'copy-link': copyText(state.shareUrl || location.href.split('#')[0]); break;
      case 'refresh-board': refreshBoard(); break;
      case 'ad-opt': answerAd(Number(el.getAttribute('data-i'))); break;
      case 'ad-cancel': cancelAd(); break;
      case 'ad-continue': continueFromAd(); break;
      default: break;
    }
  }
  function handleKeydown(e) {
    if (e.key === 'Escape') {
      if (state.ad) { cancelAd(); return; }
      if (state.modalOpen) { closeModal(); return; }
    }
  }

  /* ----------------------------- 启动 ----------------------------- */
  function init() {
    var n0 = makeName();
    state.name = n0.text;
    state.board = localBoard();
    state.boardMode = 'local';
    render();
    loadBoard().then(function () {
      // 若排行榜加载完成时正在结算页，顺手刷新
      if (state.screen === 'result' && state.last) updateBoardDom(state.last);
    });
    document.addEventListener('click', handleClick);
    document.addEventListener('keydown', handleKeydown);
  }

  // 便于课堂演示/自动化测试的调试入口（无 UI 暴露）
  window.__NL_DEBUG__ = {
    state: state,
    data: { CFG: CFG, ROUNDS: ROUNDS, EVENTS: EVENTS, QUESTIONS: QUESTIONS, NAMES: NAMES, SITE: SITE, FRUITS: FRUITS },
    beginRun: beginRun,
    settle: settle,
    chooseOption: chooseOption,
    forceResult: function (score) {
      var fake = {
        id: 'debug-' + Date.now(), ts: Date.now(), name: state.name,
        score: clamp(Math.round(score), 0, 100), sat: clamp(Math.round(score), 0, 100),
        build: clamp(Math.round(score), 0, 100), teach: clamp(Math.round(score), 0, 100),
        finance: clamp(Math.round(score), 0, 100), bonus: 0, prize: score >= PRIZE,
        title: TITLES.find(function (t) { return score >= t.min; }) || TITLES[0],
        budget: 400, cashTotal: 0, spentCost: 600,
        event: { emoji: '🌤️', title: '平静开学', desc: '调试用开局事件', budget: 0, sat: 0, build: 0, teach: 0 },
        records: [], startBudget: 1000,
        code: score >= PRIZE ? makeVoucherCode(state.name, Date.now(), score) : ''
      };
      state.last = fake;
      state.run = { name: state.name, outcome: fake, records: [], event: fake.event, budget: 400, cashTotal: 0, spentCost: 600, startBudget: 1000, metrics: { sat: 0, build: 0, teach: 0 }, index: ROUNDS.length, locked: false };
      state.screen = 'result';
      render();
      window.scrollTo(0, 0);
      return fake;
    },
    openAdModal: openAdModal,
    openQrModal: openQrModal,
    openRulesModal: openRulesModal,
    loadBoard: loadBoard,
    updateBoardDom: updateBoardDom
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
